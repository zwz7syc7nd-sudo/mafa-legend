#bagPanel{left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100vw - 18px));max-height:82vh}.bagGrid{display:grid;grid-template-columns:170px 1fr;gap:12px}.paperDoll{border:1px solid #5f4723;background:radial-gradient(circle at 50% 38%,#42351f,#120e09);border-radius:7px;min-height:300px;position:relative;display:flex;align-items:center;justify-content:center}.doll{width:92px;height:155px;position:relative;filter:drop-shadow(0 6px 7px #000)}.doll .head{position:absolute;width:28px;height:28px;border-radius:50%;background:#c99a68;left:32px;top:10px}.doll .body{position:absolute;width:62px;height:78px;left:15px;top:34px;background:linear-gradient(90deg,#4a1515,#b93529 50%,#43120f);clip-path:polygon(16% 0,84% 0,100% 25%,83% 100%,17% 100%,0 25%)}.doll .armor{position:absolute;left:21px;top:43px;width:50px;height:55px;border:4px solid #d0ad5c;border-top-width:10px;opacity:.9}.doll .sword{position:absolute;width:6px;height:92px;background:linear-gradient(#fff1a9,#b88a3c);transform:rotate(37deg);right:-2px;top:36px;box-shadow:0 0 12px #ffcf4c}.slots{position:absolute;inset:8px;pointer-events:none}.slot{position:absolute;width:55px;height:55px;border:1px solid #6c5128;border-radius:6px;background:#15100bcc;padding:4px;font-size:8px;color:#dbc89a}.slot b{display:block;color:#f0ce73;font-size:9px}.sWeapon{right:6px;top:58px}.sArmor{left:6px;top:58px}.sRing{right:6px;bottom:52px}.sBoot{left:6px;bottom:52px}.stats{position:absolute;left:8px;right:8px;bottom:6px;font-size:9px;color:#cdbb8f;text-align:center}.itemsArea{display:grid;grid-template-rows:auto 1fr;gap:8px}.tabs{display:flex;gap:6px}.tab{padding:7px 10px;border:1px solid #624a26;background:#241a0e;color:#d7c69e;border-radius:6px;font-size:10px}.tab.active{color:#ffe7a4;border-color:#aa8138;background:#4a3417}.items{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-content:start}.item{aspect-ratio:1;border:1px solid #554021;border-radius:6px;background:linear-gradient(#1b1510,#0e0a07);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;font-size:8px;color:#d7c8a3;position:relative}.item strong{font-size:16px;margin-bottom:2px}.item.rare{border-color:#4074b7;box-shadow:inset 0 0 12px #1d4c83}.item.epic{border-color:#905bc2;box-shadow:inset 0 0 12px #5f2d8a}.item.legend{border-color:#d9a542;box-shadow:inset 0 0 13px #8f5d16;color:#ffd985}.item .qty{position:absolute;right:3px;bottom:1px;font-size:7px;color:#fff}

<body>
<canvas id="game"></canvas><div id="shade"></div>
<div id="hud"><div id="portrait"></div><div id="status"><div id="statusLine"><span>Lv.<b id="lv">1</b> 荒境戰士</span><span><b id="gold">0</b> 金</span></div><div class="bar hp"><i id="hpbar"></i></div><div class="bar mp"><i id="mpbar"></i></div><div id="xp"><i id="xpbar"></i></div></div></div>
<div id="leftMenu"><button class="sideBtn" id="helpBtn">說明</button><button class="sideBtn" id="bagBtn">背包</button><button class="sideBtn" id="saveBtn">存檔</button></div>
<div id="topBtns"><button class="topBtn" id="fsBtn">全螢幕</button><button class="topBtn" id="gmBtn">GM</button></div>
<div id="miniWrap"><canvas id="mini"></canvas><div class="miniLabel">荒境古城</div></div>
<div id="targetBox"><div id="targetName">目標</div><div class="targetHp"><i id="targetHp"></i></div></div>
<div id="hotbar"><button class="hot" data-hot="0"><b>1</b>金創藥</button><button class="hot" data-hot="1"><b>2</b>魔法藥</button><button class="hot" data-hot="2"><b>3</b>回城卷</button><button class="hot" data-hot="3"><b>4</b>隨機卷</button><button class="hot" data-hot="4"><b>5</b>修復油</button></div>
<div id="joystick"><div class="stick" id="stick"></div></div>
<div id="skills"><button class="skill" id="atk">攻擊</button><button class="skill" id="fire">烈火</button><button class="skill" id="moon">半月</button><button class="skill" id="dash">野蠻</button><button class="skill" id="auto">自動<br>OFF</button></div>
<div id="toast"></div>
<div class="panel" id="bagPanel"><div class="phead"><h3>角色 / 背包</h3><button class="close" data-close="bagPanel">✕</button></div><div class="pbody"><div class="bagGrid"><div class="paperDoll"><div class="doll"><div class="head"></div><div class="body"></div><div class="armor"></div><div class="sword"></div></div><div class="slots"><div class="slot sWeapon"><b>武器</b><span id="weaponSlot">青鋼劍</span></div><div class="slot sArmor"><b>衣服</b><span id="armorSlot">荒原戰甲</span></div><div class="slot sRing"><b>戒指</b><span id="ringSlot">青玉戒</span></div><div class="slot sBoot"><b>鞋子</b><span id="bootSlot">獵風靴</span></div></div><div class="stats" id="statsText"></div></div><div class="itemsArea"><div class="tabs"><button class="tab active">全部</button><button class="tab">裝備</button><button class="tab">消耗</button></div><div class="items" id="items"></div></div></div></div></div>
<div class="panel" id="gmPanel"><div class="phead"><h3>GM 控制台</h3><button class="close" data-close="gmPanel">✕</button></div><div class="pbody"><div class="gmStats"><button class="gmToggle" data-gm="god">無敵 OFF</button><button class="gmToggle" data-gm="one">秒殺 OFF</button><button class="gmToggle" data-gm="fast">2倍移速 OFF</button><button class="gmToggle" data-gm="drop">10倍爆率 OFF</button><button class="gmAct" data-gm="level">+10 等級</button><button class="gmAct" data-gm="gold">+100,000 金</button><button class="gmAct" data-gm="spawn">刷新全圖怪物</button><button class="gmAct" data-gm="boss">召喚世界 BOSS</button><button class="gmAct" data-gm="heal">補滿 HP/MP</button><button class="gmAct" data-gm="clear">清除怪物</button><button class="gmAct" data-gm="town">傳送古城</button><button class="gmAct" data-gm="field">傳送荒原</button></div><div class="gmSelect"><select id="gmItem"><option>蒼穹屠龍 +99</option><option>焚天戰甲 +30</option><option>麻痺神戒</option><option>復活神戒</option><option>GM 王者靴</option></select><button id="makeItem">生成裝備</button></div></div></div>
<div class="panel" id="helpPanel"><div class="phead"><h3>操作說明</h3><button class="close" data-close="helpPanel">✕</button></div><div class="pbody helpText"><b>左下搖桿</b>：360° 移動。<br><b>點地面</b>：角色自動走到指定位置。<br><b>攻擊 / 烈火 / 半月 / 野蠻</b>：戰鬥技能。<br><b>自動</b>：自動巡邏整張地圖、尋怪、戰鬥、拾取。<br><b>GM</b>：生成裝備、無敵、秒殺、刷 BOSS、調整爆率。<br><br>加入 iPhone 主畫面後可獨立啟動與離線遊玩。</div></div>
<div id="rotate"><div><div class="rotateIcon">↻</div>橫向遊玩會更接近傳奇手遊介面<br><small>也可以直接保持直向遊玩</small></div></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), canvas=$('#game'),ctx=canvas.getContext('2d'),mini=$('#mini'),mctx=mini.getContext('2d');
let W=0,H=0,DPR=1,last=performance.now(),time=0,toastTimer=0,saveTimer=0,autoTarget=null,tapTarget=null;
const WORLD={w:3600,h:2600};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)); const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y); const rnd=(a,b)=>a+Math.random()*(b-a);
const seeded=(x,y)=>{let n=Math.sin(x*12.9898+y*78.233)*43758.5453;return n-Math.floor(n)};
const player={x:1800,y:1450,r:17,dir:0,lv:1,exp:0,next:100,hp:320,maxHp:320,mp:140,maxMp:140,atk:36,def:8,crit:.12,gold:0,speed:190,weapon:'青鋼劍',armor:'荒原戰甲',ring:'青玉戒',boots:'獵風靴',god:false,one:false,fast:false,dropx:false,auto:false,inv:[{name:'金創藥',icon:'藥',rarity:'normal',qty:8},{name:'魔法藥',icon:'藍',rarity:'normal',qty:5},{name:'回城卷',icon:'卷',rarity:'rare',qty:3}],kills:0};
const cam={x:0,y:0}; const move={x:0,y:0};
const keys={}; const monsters=[]; const drops=[]; const floats=[]; const effects=[]; const particles=[];
let obstacles=[]; let props=[]; let patrol=[{x:500,y:480},{x:3000,y:430},{x:3180,y:2080},{x:520,y:2180},{x:1800,y:750},{x:1800,y:2140}];let patrolIndex=0;
const names={wolf:['荒原狼','黑背狼'],boar:['鐵鬃野豬','荒原豬王'],skel:['古城骷髏','腐骨戰士'],spider:['毒牙蜘蛛','赤腹毒蛛'],mage:['幽火妖','荒原邪靈']};
const kindColor={wolf:'#6c5c50',boar:'#5a3f2d',skel:'#ddd5b9',spider:'#6f3f34',mage:'#6d4f92'};
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);let mw=126,mh=126;mini.width=mw*DPR;mini.height=mh*DPR;mini.style.width=mw+'px';mini.style.height=mh+'px';mctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize,{passive:true});resize();
function makeMap(){obstacles=[{x:1120,y:760,w:640,h:330,t:'wall'},{x:1180,y:835,w:520,h:220,t:'court',pass:true},{x:1460,y:760,w:100,h:85,t:'gate',pass:true},{x:2230,y:1580,w:450,h:300,t:'fort'},{x:720,y:1710,w:420,h:260,t:'ruin'},{x:2870,y:600,w:310,h:240,t:'shrine'}];props=[];for(let i=0;i<85;i++){let x=rnd(120,WORLD.w-120),y=rnd(120,WORLD.h-120);if(x>1000&&x<1800&&y>650&&y<1200)continue;if(Math.abs(y-(.43*x+120))<130)continue;props.push({x,y,t:Math.random()<.75?'tree':'rock',s:rnd(.7,1.25)})}for(let i=0;i<16;i++)props.push({x:1040+i*48,y:690,t:'torch',s:1})}
makeMap();
function collides(x,y,r=player.r){for(const o of obstacles){if(o.pass)continue;let nx=clamp(x,o.x,o.x+o.w),ny=clamp(y,o.y,o.y+o.h);if(Math.hypot(x-nx,y-ny)<r)return true}return false}
function tryMove(obj,dx,dy,dt){let nx=clamp(obj.x+dx*dt,obj.r,WORLD.w-obj.r),ny=clamp(obj.y+dy*dt,obj.r,WORLD.h-obj.r);if(!collides(nx,obj.y,obj.r))obj.x=nx;if(!collides(obj.x,ny,obj.r))obj.y=ny}
function smartMove(obj,tx,ty,speed,dt){let dx=tx-obj.x,dy=ty-obj.y,d=Math.hypot(dx,dy);if(d<1)return true;let base=Math.atan2(dy,dx),step=speed*dt;for(const off of [0,.35,-.35,.7,-.7,1.05,-1.05,1.4,-1.4]){let a=base+off,nx=clamp(obj.x+Math.cos(a)*step,obj.r,WORLD.w-obj.r),ny=clamp(obj.y+Math.sin(a)*step,obj.r,WORLD.h-obj.r);if(!collides(nx,ny,obj.r)){obj.x=nx;obj.y=ny;obj.dir=a;return d<step+4}}return false}
function spawnMonster(kind,x,y,boss=false){let r=boss?34:kind==='boar'?22:18,base=boss?1800:kind==='mage'?150:kind==='skel'?130:kind==='boar'?120:100;let m={id:Math.random().toString(36).slice(2),kind,name:boss?'荒境魔君':names[kind][Math.random()<.15?1:0],x,y,homeX:x,homeY:y,r,boss,hp:base,maxHp:base,atk:boss?38:kind==='mage'?17:13,speed:boss?88:rnd(62,92),aggro:boss?580:330,attackRange:boss?72:46,cool:0,wander:0,dead:false,respawn:0,hit:0,dir:0,anim:0};monsters.push(m);return m}
function spawnAll(){monsters.length=0;let kinds=['wolf','boar','skel','spider','mage'];for(let i=0;i<30;i++){let k=kinds[i%kinds.length],x,y,tries=0;do{x=rnd(250,WORLD.w-250);y=rnd(250,WORLD.h-250);tries++}while((collides(x,y,25)||Math.hypot(x-player.x,y-player.y)<260)&&tries<40);spawnMonster(k,x,y,false)}spawnMonster('mage',3060,480,true)}spawnAll();
function worldToScreen(x,y){return{x:x-cam.x,y:y-cam.y}}
function addFloat(x,y,text,c='#fff',size=15){floats.push({x,y,text,c,size,t:0,life:1})}
function addEffect(type,x,y,dir=0){effects.push({type,x,y,dir,t:0,life:type==='fire'?0.42:type==='moon'?0.55:0.26})}
function toast(s){let el=$('#toast');el.textContent=s;el.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.opacity=0,1800)}
function targetUI(m){let box=$('#targetBox');if(!m||m.dead){box.style.opacity=0;return}box.style.opacity=1;$('#targetName').textContent=m.name+(m.boss?'・世界BOSS':'');$('#targetHp').style.width=(100*m.hp/m.maxHp)+'%'}
function nearestMonster(){let best=null,bd=1e9;for(const m of monsters){if(m.dead)continue;let d=dist(player,m);if(d<bd){bd=d;best=m}}return best}
function damageMonster(m,amt,crit=false){if(!m||m.dead)return;m.hp-=amt;m.hit=.12;addFloat(m.x,m.y-m.r-16,(crit?'暴擊 ':'')+'-'+Math.floor(amt),crit?'#ffd34e':'#fff1d2',crit?18:15);if(m.hp<=0)killMonster(m)}
function killMonster(m){m.dead=true;m.respawn=time+(m.boss?20:8+rnd(0,7));player.kills++;let gain=m.boss?420:22;player.exp+=gain;player.gold+=m.boss?1200:Math.floor(rnd(8,35));addFloat(m.x,m.y-20,'擊破','#ffcf64',16);if(Math.random()<(player.dropx?.95:.45)||m.boss)dropLoot(m);while(player.exp>=player.next){player.exp-=player.next;player.lv++;player.next=Math.floor(player.next*1.22);player.maxHp+=34;player.maxMp+=10;player.atk+=6;player.def+=2;player.hp=player.maxHp;player.mp=player.maxMp;toast('升級！Lv.'+player.lv)} }
function dropLoot(m){let pool=m.boss?[['魔君戰甲','legend'],['赤焰戰刃','legend'],['復活神戒','epic'],['高級金創藥','rare']]:[['黑鐵頭盔','rare'],['玄鐵戒','rare'],['荒原戰靴','normal'],['強效金創藥','normal'],['銀月刀','epic']];let count=m.boss?5:Math.ceil(rnd(1,2.8));for(let i=0;i<count;i++){let p=pool[Math.floor(Math.random()*pool.length)];drops.push({x:m.x+rnd(-28,28),y:m.y+rnd(-28,28),name:p[0],rarity:p[1],t:0})}}
function pickup(){for(let i=drops.length-1;i>=0;i--){let d=drops[i];if(Math.hypot(d.x-player.x,d.y-player.y)<54){player.inv.push({name:d.name,rarity:d.rarity,icon:d.rarity==='legend'?'神':d.rarity==='epic'?'紫':'裝',qty:1});toast('拾取：'+d.name);drops.splice(i,1);renderBag()}}}
let attackCd=0,fireCd=0,moonCd=0,dashCd=0;
function attack(type='basic'){let m=nearestMonster();if(!m)return;let d=dist(player,m),range=type==='moon'?105:78;if(d>range){toast('距離太遠');return}if(type==='basic'&&attackCd>0||type==='fire'&&fireCd>0||type==='moon'&&moonCd>0)return;let mult=1;if(type==='fire'){if(player.mp<12){toast('MP 不足');return}player.mp-=12;mult=2.35;fireCd=1.8;addEffect('fire',player.x,player.y,player.dir)}else if(type==='moon'){if(player.mp<8){toast('MP 不足');return}player.mp-=8;moonCd=1.15;addEffect('moon',player.x,player.y,player.dir);for(const n of monsters){if(!n.dead&&dist(player,n)<115){let cr=Math.random()<player.crit;damageMonster(n,player.one?99999:player.atk*1.25*(cr?1.8:1),cr)}}return}else{attackCd=.55;addEffect('slash',player.x,player.y,player.dir)}let crit=Math.random()<player.crit;let dmg=player.one?99999:player.atk*mult*(rnd(.88,1.12))*(crit?1.8:1);damageMonster(m,dmg,crit)}
function dash(){if(dashCd>0)return;dashCd=3.2;let dx=Math.cos(player.dir),dy=Math.sin(player.dir);for(let i=0;i<8;i++)tryMove(player,dx*42,dy*42,.12);for(const m of monsters){if(!m.dead&&dist(player,m)<70)damageMonster(m,player.one?99999:player.atk*1.4,false)}addEffect('dash',player.x,player.y,player.dir)}
function respawnMonsters(){for(const m of monsters){if(m.dead&&time>=m.respawn){m.dead=false;m.hp=m.maxHp;m.x=m.homeX+rnd(-90,90);m.y=m.homeY+rnd(-90,90)}}}
function autoAI(dt){if(!player.auto)return;let m=autoTarget;if(!m||m.dead){m=nearestMonster();autoTarget=m}if(m){let dx=m.x-player.x,dy=m.y-player.y,d=Math.hypot(dx,dy);player.dir=Math.atan2(dy,dx);if(d>62){let sp=player.speed*(player.fast?2:1);smartMove(player,m.x,m.y,sp,dt)}else{if(fireCd<=0&&player.mp>=12)attack('fire');else if(attackCd<=0)attack('basic')}}else{let p=patrol[patrolIndex%patrol.length],dx=p.x-player.x,dy=p.y-player.y,d=Math.hypot(dx,dy);if(d<50)patrolIndex++;else{smartMove(player,p.x,p.y,player.speed,dt)}}}
function update(dt){time+=dt;attackCd=Math.max(0,attackCd-dt);fireCd=Math.max(0,fireCd-dt);moonCd=Math.max(0,moonCd-dt);dashCd=Math.max(0,dashCd-dt);if(!player.auto){let mx=move.x,my=move.y;if(keys['ArrowLeft']||keys['a'])mx=-1;if(keys['ArrowRight']||keys['d'])mx=1;if(keys['ArrowUp']||keys['w'])my=-1;if(keys['ArrowDown']||keys['s'])my=1;let l=Math.hypot(mx,my);if(l>.08){mx/=Math.max(1,l);my/=Math.max(1,l);let sp=player.speed*(player.fast?2:1);player.dir=Math.atan2(my,mx);tryMove(player,mx*sp,my*sp,dt);tapTarget=null}else if(tapTarget){let dx=tapTarget.x-player.x,dy=tapTarget.y-player.y,d=Math.hypot(dx,dy);if(d<8)tapTarget=null;else{player.dir=Math.atan2(dy,dx);let sp=player.speed*(player.fast?2:1);smartMove(player,tapTarget.x,tapTarget.y,sp,dt)}}}else autoAI(dt);
for(const m of monsters){if(m.dead)continue;m.cool=Math.max(0,m.cool-dt);m.hit=Math.max(0,m.hit-dt);m.anim+=dt;let d=dist(m,player);if(d<m.aggro&&!player.god){let dx=player.x-m.x,dy=player.y-m.y;m.dir=Math.atan2(dy,dx);if(d>m.attackRange){smartMove(m,player.x,player.y,m.speed,dt)}else if(m.cool<=0){m.cool=m.boss?1.2:1.8;let dmg=Math.max(1,m.atk-player.def*rnd(.5,.9));player.hp-=dmg;addFloat(player.x,player.y-42,'-'+Math.floor(dmg),'#ff6b55',14);if(player.hp<=0){player.hp=player.maxHp;player.mp=player.maxMp;player.x=1510;player.y=1150;toast('你被擊倒，已返回古城')}}}else{m.wander-=dt;if(m.wander<=0){m.wander=rnd(1.5,4);m.dir=rnd(-Math.PI,Math.PI)}if(Math.random()<.22*dt)tryMove(m,Math.cos(m.dir)*m.speed*.3,Math.sin(m.dir)*m.speed*.3,dt)}}
for(const d of drops)d.t+=dt;pickup();respawnMonsters();for(let i=floats.length-1;i>=0;i--){let f=floats[i];f.t+=dt;f.y-=26*dt;if(f.t>f.life)floats.splice(i,1)}for(let i=effects.length-1;i>=0;i--){let e=effects[i];e.t+=dt;if(e.t>e.life)effects.splice(i,1)}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t>p.life)particles.splice(i,1)}
cam.x+=(clamp(player.x-W*.5,0,WORLD.w-W)-cam.x)*Math.min(1,dt*8);cam.y+=(clamp(player.y-H*.5,0,WORLD.h-H)-cam.y)*Math.min(1,dt*8);targetUI(autoTarget||nearestMonster());updateHUD();saveTimer+=dt;if(saveTimer>4){saveTimer=0;saveGame(false)}}
function updateHUD(){$('#lv').textContent=player.lv;$('#gold').textContent=player.gold;$('#hpbar').style.width=(100*clamp(player.hp/player.maxHp,0,1))+'%';$('#mpbar').style.width=(100*clamp(player.mp/player.maxMp,0,1))+'%';$('#xpbar').style.width=(100*player.exp/player.next)+'%'}
function drawGround(){ctx.fillStyle='#1b281b';ctx.fillRect(0,0,W,H);let tile=64,sx=Math.floor(cam.x/tile)*tile,sy=Math.floor(cam.y/tile)*tile;for(let y=sy;y<cam.y+H+tile;y+=tile){for(let x=sx;x<cam.x+W+tile;x+=tile){let s=worldToScreen(x,y),r=seeded(x/tile,y/tile);ctx.fillStyle=r>.55?'#20351f':'#1d301c';ctx.fillRect(s.x,s.y,tile+1,tile+1);ctx.fillStyle='rgba(255,255,255,.015)';ctx.fillRect(s.x,s.y,tile,1);ctx.fillRect(s.x,s.y,1,tile);if(r>.77){ctx.fillStyle='#294329';ctx.fillRect(s.x+12+r*20,s.y+10,3,9);ctx.fillRect(s.x+45,s.y+35+r*10,2,6)}}}

ctx.strokeStyle='#a1845f';ctx.lineWidth=170;ctx.lineCap='round';ctx.beginPath();let p1=worldToScreen(0,2040),p2=worldToScreen(850,1780),p3=worldToScreen(1800,1500),p4=worldToScreen(3600,1180);ctx.moveTo(p1.x,p1.y);ctx.bezierCurveTo(p2.x,p2.y,p3.x,p3.y,p4.x,p4.y);ctx.stroke();ctx.strokeStyle='#bea47d';ctx.lineWidth=122;ctx.stroke();}

function drawProp(p){let s=worldToScreen(p.x,p.y);if(s.x<-70||s.y<-90||s.x>W+70||s.y>H+70)return;ctx.save();ctx.translate(s.x,s.y);ctx.scale(p.s,p.s);if(p.t==='tree'){ctx.fillStyle='#2b2118';ctx.fillRect(-6,5,12,36);ctx.fillStyle='#112612';ctx.shadowColor='#000';ctx.shadowBlur=6;ctx.beginPath();ctx.arc(0,-7,25,0,Math.PI*2);ctx.arc(-14,3,17,0,Math.PI*2);ctx.arc(15,4,19,0,Math.PI*2);ctx.fill();ctx.fillStyle='#234226';ctx.beginPath();ctx.arc(-7,-14,13,0,Math.PI*2);ctx.arc(12,-10,12,0,Math.PI*2);ctx.fill()}else if(p.t==='torch'){ctx.fillStyle='#4e3422';ctx.fillRect(-3,0,6,27);ctx.shadowColor='#ff852d';ctx.shadowBlur=18;ctx.fillStyle='#ff6a1d';ctx.beginPath();ctx.arc(0,-7,7+Math.sin(time*9+p.x)*2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffe26e';ctx.beginPath();ctx.arc(0,-9,3,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle='#77776f';ctx.beginPath();ctx.moveTo(-18,13);ctx.lineTo(-11,-9);ctx.lineTo(6,-16);ctx.lineTo(22,8);ctx.lineTo(12,17);ctx.closePath();ctx.fill();ctx.fillStyle='#9a9990';ctx.fillRect(-7,-7,10,4)}ctx.restore()}
function drawPlayer(){let s=worldToScreen(player.x,player.y),walk=Math.sin(time*12)*3;ctx.save();ctx.translate(s.x,s.y);ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(0,24,22,8,0,0,Math.PI*2);ctx.fill();ctx.rotate(player.dir+Math.PI/2);ctx.strokeStyle='#2c1a12';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-7,9);ctx.lineTo(-8+walk,28);ctx.moveTo(7,9);ctx.lineTo(8-walk,28);ctx.stroke();ctx.fillStyle='#7a1715';ctx.beginPath();ctx.moveTo(-17,-18);ctx.lineTo(17,-18);ctx.lineTo(21,16);ctx.lineTo(0,26);ctx.lineTo(-21,16);ctx.closePath();ctx.fill();ctx.fillStyle='#d6b45b';ctx.fillRect(-15,-13,30,7);ctx.strokeStyle='#b89043';ctx.lineWidth=4;ctx.strokeRect(-13,-8,26,23);ctx.fillStyle='#c99562';ctx.beginPath();ctx.arc(0,-28,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#201411';ctx.beginPath();ctx.arc(0,-31,11,Math.PI,0);ctx.fill();ctx.strokeStyle='#f0d073';ctx.lineWidth=5;ctx.shadowColor='#ffbb38';ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(17,-3);ctx.lineTo(44,-27);ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle='#6f4723';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(15,-5);ctx.lineTo(24,5);ctx.stroke();ctx.restore();ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillStyle='#72b6ff';ctx.fillText('GM戰士',s.x,s.y-49)}
function drawMonster(m){let s=worldToScreen(m.x,m.y);if(s.x<-90||s.y<-90||s.x>W+90||s.y>H+90)return;ctx.save();ctx.translate(s.x,s.y);ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(0,m.r*.85,m.r*1.05,m.r*.38,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=m.hit?0.62:1;if(m.kind==='wolf'){ctx.rotate(m.dir);ctx.fillStyle='#5b5149';ctx.beginPath();ctx.ellipse(0,0,20,13,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#756961';ctx.beginPath();ctx.moveTo(12,-7);ctx.lineTo(28,-15);ctx.lineTo(22,1);ctx.closePath();ctx.fill();ctx.strokeStyle='#4a413c';ctx.lineWidth=5;for(const lx of [-9,8]){ctx.beginPath();ctx.moveTo(lx,9);ctx.lineTo(lx+Math.sin(m.anim*8)*4,24);ctx.stroke()}}else if(m.kind==='boar'){ctx.fillStyle='#4b3325';ctx.beginPath();ctx.ellipse(0,2,22,17,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#76523a';ctx.beginPath();ctx.arc(16,-2,11,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#eee1b1';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(21,3);ctx.lineTo(30,9);ctx.moveTo(21,-1);ctx.lineTo(31,-7);ctx.stroke()}else if(m.kind==='skel'){ctx.strokeStyle='#ded8c3';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.arc(0,-14,9,0,Math.PI*2);ctx.moveTo(0,-5);ctx.lineTo(0,19);ctx.moveTo(-14,4);ctx.lineTo(14,4);ctx.moveTo(0,19);ctx.lineTo(-10,34);ctx.moveTo(0,19);ctx.lineTo(10,34);ctx.stroke();ctx.fillStyle='#111';ctx.fillRect(-5,-17,3,3);ctx.fillRect(3,-17,3,3)}else if(m.kind==='spider'){ctx.strokeStyle='#7d4a38';ctx.lineWidth=4;for(let i=0;i<4;i++){let yy=-12+i*8;ctx.beginPath();ctx.moveTo(-7,yy);ctx.lineTo(-24,yy-8+(i%2)*12);ctx.moveTo(7,yy);ctx.lineTo(24,yy-8+(i%2)*12);ctx.stroke()}ctx.fillStyle='#522b26';ctx.beginPath();ctx.ellipse(0,0,16,19,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d84b31';ctx.beginPath();ctx.arc(0,-4,5,0,Math.PI*2);ctx.fill()}else{ctx.shadowColor=m.boss?'#ff3b28':'#9f5dff';ctx.shadowBlur=m.boss?22:12;ctx.fillStyle=m.boss?'#6e1716':'#5e3e74';ctx.beginPath();ctx.arc(0,0,m.r,0,Math.PI*2);ctx.fill();ctx.fillStyle=m.boss?'#d73d2c':'#9566b5';ctx.beginPath();ctx.moveTo(-m.r*.9,-m.r*.3);ctx.lineTo(0,-m.r*1.3);ctx.lineTo(m.r*.9,-m.r*.3);ctx.closePath();ctx.fill();if(m.boss){ctx.fillStyle='#ff9e4a';for(let i=0;i<3;i++){let a=time*2+i*2.1;ctx.beginPath();ctx.arc(Math.cos(a)*m.r*1.2,Math.sin(a)*m.r*.5,m.r*.14,0,Math.PI*2);ctx.fill()}}ctx.shadowBlur=0}ctx.globalAlpha=1;ctx.restore();ctx.textAlign='center';ctx.font=(m.boss?'bold 12px':'10px')+' sans-serif';ctx.fillStyle=m.boss?'#ffb059':'#f0e0bd';ctx.fillText(m.name,s.x,s.y-m.r-22);let bw=m.boss?96:60;ctx.fillStyle='#160a09';ctx.fillRect(s.x-bw/2,s.y-m.r-16,bw,6);ctx.fillStyle=m.boss?'#e13b31':'#b52f2a';ctx.fillRect(s.x-bw/2,s.y-m.r-16,bw*clamp(m.hp/m.maxHp,0,1),6)}
function drawDrop(d){let s=worldToScreen(d.x,d.y);let pulse=1+Math.sin(time*5+d.x)*.08;ctx.save();ctx.translate(s.x,s.y);ctx.scale(pulse,pulse);ctx.shadowColor=d.rarity==='legend'?'#ffb62e':d.rarity==='epic'?'#a55dff':'#e6d6a3';ctx.shadowBlur=14;ctx.fillStyle=d.rarity==='legend'?'#f3b83c':d.rarity==='epic'?'#9a57c9':d.rarity==='rare'?'#4b7fc6':'#cfc09a';ctx.rotate(time*.5);ctx.fillRect(-8,-8,16,16);ctx.restore();ctx.font='9px sans-serif';ctx.textAlign='center';ctx.fillStyle='#ffe9ad';ctx.fillText(d.name,s.x,s.y-15)}
function drawEffect(e){let s=worldToScreen(e.x,e.y),p=e.t/e.life;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(e.dir);if(e.type==='slash'){ctx.strokeStyle=`rgba(255,239,166,${1-p})`;ctx.lineWidth=10*(1-p)+2;ctx.beginPath();ctx.arc(0,0,65,-1.05,.75);ctx.stroke()}else if(e.type==='fire'){ctx.strokeStyle=`rgba(255,105,20,${1-p})`;ctx.lineWidth=19*(1-p)+3;ctx.shadowColor='#ff4d00';ctx.shadowBlur=16;ctx.beginPath();ctx.arc(0,0,78,-1.2,.75);ctx.stroke();ctx.shadowBlur=0}else if(e.type==='moon'){ctx.strokeStyle=`rgba(103,169,255,${1-p})`;ctx.lineWidth=11*(1-p)+2;ctx.beginPath();ctx.arc(0,0,110*p,0,Math.PI*2);ctx.stroke()}else if(e.type==='dash'){ctx.strokeStyle=`rgba(119,255,151,${1-p})`;ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(-100*p,0);ctx.lineTo(20,0);ctx.stroke()}ctx.restore()}
function drawFloat(f){let s=worldToScreen(f.x,f.y);ctx.globalAlpha=1-f.t/f.life;ctx.font='bold '+f.size+'px sans-serif';ctx.textAlign='center';ctx.fillStyle=f.c;ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText(f.text,s.x,s.y);ctx.fillText(f.text,s.x,s.y);ctx.globalAlpha=1}
function drawMini(){let w=126,h=126;mctx.clearRect(0,0,w,h);mctx.fillStyle='#172117';mctx.fillRect(0,0,w,h);mctx.strokeStyle='#a17f56';mctx.lineWidth=5;mctx.beginPath();mctx.moveTo(0,98);mctx.bezierCurveTo(35,82,68,70,126,48);mctx.stroke();mctx.fillStyle='#67645c';mctx.fillRect(36,24,30,25);for(const m of monsters){if(m.dead)continue;mctx.fillStyle=m.boss?'#ff3b2f':'#d37d54';mctx.beginPath();mctx.arc(m.x/WORLD.w*w,m.y/WORLD.h*h,m.boss?3:1.5,0,Math.PI*2);mctx.fill()}mctx.fillStyle='#54b3ff';mctx.beginPath();mctx.arc(player.x/WORLD.w*w,player.y/WORLD.h*h,3,0,Math.PI*2);mctx.fill()}
function draw(){ctx.save();drawGround();for(const o of obstacles)drawObstacle(o);for(const p of props)drawProp(p);for(const d of drops)drawDrop(d);for(const m of monsters)if(!m.dead)drawMonster(m);drawPlayer();for(const e of effects)drawEffect(e);for(const f of floats)drawFloat(f);ctx.restore();drawMini()}
function loop(t){let dt=Math.min(.034,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
// input
addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);
const joy=$('#joystick'),stick=$('#stick');let joyId=null;
function joyMove(cx,cy){let r=joy.getBoundingClientRect(),x=cx-(r.left+r.width/2),y=cy-(r.top+r.height/2),max=r.width*.33,l=Math.hypot(x,y);if(l>max){x=x/l*max;y=y/l*max}move.x=x/max;move.y=y/max;stick.style.transform=`translate(${x}px,${y}px)`}
function joyEnd(){joyId=null;move.x=move.y=0;stick.style.transform='translate(0,0)'}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;try{joy.setPointerCapture(e.pointerId)}catch{}joyMove(e.clientX,e.clientY);player.auto=false;autoTarget=null;updateAuto();e.preventDefault()});joy.addEventListener('pointermove',e=>{if(joyId===e.pointerId){joyMove(e.clientX,e.clientY);e.preventDefault()}});joy.addEventListener('pointerup',e=>{if(joyId===e.pointerId)joyEnd()});joy.addEventListener('pointercancel',joyEnd);
joy.addEventListener('touchstart',e=>{let t=e.changedTouches[0];joyMove(t.clientX,t.clientY);player.auto=false;autoTarget=null;updateAuto();e.preventDefault()},{passive:false});joy.addEventListener('touchmove',e=>{let t=e.changedTouches[0];joyMove(t.clientX,t.clientY);e.preventDefault()},{passive:false});joy.addEventListener('touchend',e=>{joyEnd();e.preventDefault()},{passive:false});
canvas.addEventListener('pointerdown',e=>{if(e.clientX<170&&e.clientY>H-180||e.clientX>W-230&&e.clientY>H-210)return;tapTarget={x:e.clientX+cam.x,y:e.clientY+cam.y};player.auto=false;autoTarget=null;updateAuto()});
function press(id,fn){let el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();fn()})}
press('#atk',()=>attack('basic'));press('#fire',()=>attack('fire'));press('#moon',()=>attack('moon'));press('#dash',dash);press('#auto',()=>{player.auto=!player.auto;autoTarget=null;updateAuto();toast(player.auto?'自動掃圖啟動':'自動掃圖關閉')});
function updateAuto(){$('#auto').innerHTML='自動<br>'+(player.auto?'ON':'OFF');$('#auto').style.borderColor=player.auto?'#7bcb83':'#9f7a35'}
press('#gmBtn',()=>$('#gmPanel').classList.add('show'));press('#bagBtn',()=>{$('#bagPanel').classList.add('show');renderBag()});press('#helpBtn',()=>$('#helpPanel').classList.add('show'));press('#saveBtn',()=>{saveGame(true)});
// close buttons
document.querySelectorAll('.close').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();$('#'+b.dataset.close).classList.remove('show')}));
$('#fsBtn').addEventListener('pointerdown',async e=>{e.preventDefault();try{if(document.fullscreenElement){await document.exitFullscreen();return}if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();return}if(window.navigator.standalone){toast('目前已是主畫面模式');return}alert('iPhone：Safari → 分享 → 加入主畫面，即可用獨立全螢幕模式開啟。')}catch{alert('iPhone：Safari → 分享 → 加入主畫面。')}});
document.querySelectorAll('[data-gm]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();let k=b.dataset.gm;if(k==='god'){player.god=!player.god;b.classList.toggle('on',player.god);b.textContent='無敵 '+(player.god?'ON':'OFF')}else if(k==='one'){player.one=!player.one;b.classList.toggle('on',player.one);b.textContent='秒殺 '+(player.one?'ON':'OFF')}else if(k==='fast'){player.fast=!player.fast;b.classList.toggle('on',player.fast);b.textContent='2倍移速 '+(player.fast?'ON':'OFF')}else if(k==='drop'){player.dropx=!player.dropx;b.classList.toggle('on',player.dropx);b.textContent='10倍爆率 '+(player.dropx?'ON':'OFF')}else if(k==='level'){player.lv+=10;player.atk+=60;player.def+=20;player.maxHp+=500;player.hp=player.maxHp;toast('+10 等級')}else if(k==='gold'){player.gold+=100000;toast('+100,000 金')}else if(k==='spawn'){spawnAll();toast('全圖怪物刷新')}else if(k==='boss'){spawnMonster('mage',player.x+180,player.y,true);toast('世界 BOSS 已召喚')}else if(k==='heal'){player.hp=player.maxHp;player.mp=player.maxMp;toast('HP/MP 已補滿')}else if(k==='clear'){monsters.forEach(m=>m.dead=true);toast('怪物已清除')}else if(k==='town'){player.x=1510;player.y=1120;toast('傳送荒境古城')}else if(k==='field'){player.x=2920;player.y=1940;toast('傳送荒原深處')}updateHUD();saveGame(false)}));
$('#makeItem').addEventListener('pointerdown',e=>{e.preventDefault();let n=$('#gmItem').value,rar='legend',icon='神';player.inv.push({name:n,rarity:rar,icon,qty:1});if(n.includes('屠龍')){player.weapon=n;player.atk=Math.max(player.atk,999)}else if(n.includes('戰甲')){player.armor=n;player.def=Math.max(player.def,180)}else if(n.includes('靴')){player.boots=n;player.speed=260}else player.ring=n;renderBag();toast('生成：'+n);saveGame(false)});
document.querySelectorAll('.hot').forEach((b,i)=>b.addEventListener('pointerdown',e=>{e.preventDefault();if(i===0){player.hp=Math.min(player.maxHp,player.hp+120);toast('使用金創藥')}else if(i===1){player.mp=Math.min(player.maxMp,player.mp+80);toast('使用魔法藥')}else if(i===2){player.x=1510;player.y=1120;toast('回城')}else if(i===3){player.x=rnd(300,WORLD.w-300);player.y=rnd(300,WORLD.h-300);toast('隨機傳送')}else toast('裝備已修復')}));
function renderBag(){$('#weaponSlot').textContent=player.weapon;$('#armorSlot').textContent=player.armor;$('#ringSlot').textContent=player.ring;$('#bootSlot').textContent=player.boots;$('#statsText').textContent=`攻擊 ${Math.floor(player.atk)}　防禦 ${Math.floor(player.def)}　暴擊 ${Math.floor(player.crit*100)}%`;let root=$('#items');root.innerHTML='';let base=[{name:'強效金創藥',icon:'藥',rarity:'normal',qty:12},{name:'回城卷',icon:'卷',rarity:'rare',qty:5},{name:'銀月刀',icon:'刀',rarity:'epic',qty:1},{name:'黑鐵頭盔',icon:'盔',rarity:'rare',qty:1}];[...base,...player.inv].slice(-30).forEach(it=>{let d=document.createElement('div');d.className='item '+(it.rarity||'normal');d.innerHTML=`<strong>${it.icon||'裝'}</strong><span>${it.name}</span>${it.qty>1?`<span class="qty">${it.qty}</span>`:''}`;d.addEventListener('pointerdown',()=>equipItem(it));root.appendChild(d)})}
function equipItem(it){if(it.name.includes('刀')||it.name.includes('劍')||it.name.includes('屠龍')){player.weapon=it.name;player.atk+=10}else if(it.name.includes('甲')){player.armor=it.name;player.def+=6}else if(it.name.includes('戒')){player.ring=it.name;player.crit=Math.min(.65,player.crit+.04)}else if(it.name.includes('靴')){player.boots=it.name;player.speed+=8}else return;renderBag();toast('裝備：'+it.name);saveGame(false)}
function saveGame(show=true){try{localStorage.setItem('mafaLegendV3',JSON.stringify({lv:player.lv,exp:player.exp,next:player.next,hp:player.hp,maxHp:player.maxHp,mp:player.mp,maxMp:player.maxMp,atk:player.atk,def:player.def,crit:player.crit,gold:player.gold,speed:player.speed,weapon:player.weapon,armor:player.armor,ring:player.ring,boots:player.boots,inv:player.inv,x:player.x,y:player.y,god:player.god,one:player.one,fast:player.fast,dropx:player.dropx,kills:player.kills}));if(show)toast('已儲存進度')}catch{if(show)toast('此瀏覽器無法儲存')}}
function loadGame(){try{let s=JSON.parse(localStorage.getItem('mafaLegendV3')||'null');if(s)Object.assign(player,s)}catch{}updateAuto();renderBag();updateHUD()}loadGame();setTimeout(()=>toast('遊戲引擎已啟動・可操控'),500);
})();
</script>
<script>if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script>
