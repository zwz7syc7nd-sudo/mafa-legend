<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#090b0d" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<title>瑪法荒境・單機 GM v2</title>
<style>
:root{--gold:#d8b86e;--panel:rgba(14,13,11,.88);--line:#7a5c2c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#1a2517}
#hud{position:fixed;z-index:10;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.portrait{width:50px;height:50px;border:2px solid #a88a4e;border-radius:50%;background:radial-gradient(circle at 50% 35%,#c98e5d 0 18%,#4a2e22 19% 30%,#171717 31%);box-shadow:0 2px 10px #000}
.status{min-width:175px}.name{font-size:12px;text-shadow:0 1px 2px #000;margin-bottom:4px}.bar{height:11px;border:1px solid #3d2b1b;background:#160e0d;border-radius:7px;overflow:hidden;margin:2px 0}.bar>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#971e17,#e24b32)}.bar.mp>i{background:linear-gradient(90deg,#183a8a,#2e7ee7)}
#topRight{position:fixed;z-index:12;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;gap:6px}.topbtn{pointer-events:auto;border:1px solid #8a6b34;background:linear-gradient(#4b3a21,#20170d);color:#f0d99b;border-radius:8px;padding:7px 10px;font-weight:700;font-size:12px;box-shadow:0 2px 7px #0008}
#quest{position:fixed;z-index:9;right:max(10px,env(safe-area-inset-right));top:64px;width:min(210px,42vw);padding:8px 10px;border:1px solid #6d562d;background:#14120fcc;border-radius:8px;font-size:11px;line-height:1.45;color:#e6ddca;pointer-events:none}
#minimapWrap{position:fixed;z-index:9;right:max(10px,env(safe-area-inset-right));top:126px;width:112px;height:112px;border:1px solid #8d7139;background:#12100dce;border-radius:50%;overflow:hidden;pointer-events:none;box-shadow:0 2px 10px #000a}.miniTitle{position:absolute;z-index:3;left:0;right:0;bottom:3px;text-align:center;font-size:9px;color:#ecd28c;text-shadow:0 1px 2px #000}#mini{width:100%;height:100%}
#joystick{position:fixed;z-index:15;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:142px;height:142px;border-radius:50%;background:radial-gradient(circle,#ffffff12 0 26%,#161616b8 27% 58%,#4c473d80 59% 60%,#1118 61%);border:1px solid #7a7468;box-shadow:inset 0 0 25px #0009,0 4px 16px #0009}.stick{position:absolute;left:45px;top:45px;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#867e70,#2c2924);border:1px solid #aaa18e;box-shadow:0 2px 9px #000b;transition:transform .04s linear}
#actions{position:fixed;z-index:15;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:190px;height:178px}.skill{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;color:#f6e9c0;font-weight:800;text-shadow:0 1px 3px #000;border:2px solid #8a6a2d;background:radial-gradient(circle at 35% 25%,#8a4b25,#2b170e 55%,#120a06);box-shadow:inset 0 0 0 2px #1b140c,0 3px 11px #000b;user-select:none}.skill:active{transform:scale(.94)}#atk{width:86px;height:86px;right:0;bottom:0;font-size:15px;background:radial-gradient(circle at 35% 30%,#bb3d2c,#571611 58%,#240908)}#fire{width:62px;height:62px;right:85px;bottom:87px;font-size:12px}#bagBtn{width:56px;height:56px;right:114px;bottom:24px;font-size:11px;background:radial-gradient(circle at 35% 30%,#6b5324,#2b210f)}#autoBtn{width:62px;height:62px;right:20px;bottom:103px;font-size:11px;background:radial-gradient(circle at 35% 30%,#315e3a,#142719)}
#lootTip{position:fixed;z-index:16;left:50%;bottom:18px;transform:translateX(-50%);font-size:11px;padding:6px 10px;border-radius:7px;background:#0009;color:#f0d798;opacity:0;transition:opacity .2s;pointer-events:none}
.panel{position:fixed;z-index:30;display:none;background:linear-gradient(#211a12ee,#0d0b09f2);border:1px solid #8b6b37;box-shadow:0 12px 40px #000c;border-radius:12px;color:#eee}.panel.show{display:block}.panel h3{margin:0;color:#f1d38a;font-size:16px}.panel .head{display:flex;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid #584321}.close{border:0;background:#3a2c1c;color:#e9d5a3;border-radius:7px;padding:5px 9px;font-size:14px}.panelBody{padding:10px;overflow:auto;max-height:60vh}
#gmPanel{right:10px;top:56px;width:min(360px,calc(100vw - 20px))}.gridBtns{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.gmbtn{border:1px solid #7e6033;background:linear-gradient(#50391e,#26180d);color:#f2dfb0;border-radius:8px;padding:10px 8px;font-size:12px;font-weight:700}.gmbtn:active{transform:translateY(1px);background:#6b4e27}.gmrow{display:grid;grid-template-columns:1fr 95px;gap:6px;margin-top:8px}.gmrow select,.gmrow button{min-height:38px;border-radius:7px;border:1px solid #806031;background:#21170e;color:#f1e0b4;padding:0 8px}
#bagPanel{left:50%;top:50%;transform:translate(-50%,-50%);width:min(390px,calc(100vw - 20px));max-height:76vh}.equip{display:grid;grid-template-columns:80px 1fr;gap:10px;margin-bottom:12px}.charCard{height:150px;border:1px solid #58431f;border-radius:8px;background:radial-gradient(circle at 50% 35%,#4a3d27,#16120d);display:flex;align-items:center;justify-content:center;font-size:54px}.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px}.slot{min-height:50px;border:1px solid #5f4721;background:#15100b;border-radius:7px;padding:6px;font-size:10px;color:#d8c79f}.slot b{display:block;color:#f4da91;margin-bottom:2px}.items{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.item{aspect-ratio:1;border:1px solid #5e4620;border-radius:7px;background:#17110b;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;font-size:9px;color:#e6d8b2}.item.epic{box-shadow:inset 0 0 14px #7e33b8;border-color:#8d5ac0}.item.legend{box-shadow:inset 0 0 14px #b87d22;border-color:#cf9a3c;color:#ffd47b}
#fsHint{position:fixed;z-index:40;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);padding:7px 10px;border:1px solid #5d4a2d;background:#12100dde;border-radius:8px;font-size:10px;color:#dacba9;pointer-events:none;opacity:.95}
#debugTouch{position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;background:#0008;padding:5px 8px;border-radius:6px;pointer-events:none;display:none}
@media (max-width:430px){#quest{display:none}#minimapWrap{width:92px;height:92px;top:55px}.portrait{width:44px;height:44px}.status{min-width:145px}.name{font-size:11px}.bar{height:9px}#joystick{width:128px;height:128px}.stick{left:40px;top:40px;width:48px;height:48px}#actions{width:175px;height:160px}#atk{width:80px;height:80px}#fire{width:58px;height:58px;right:80px;bottom:82px}#autoBtn{width:58px;height:58px;right:20px;bottom:96px}#bagBtn{width:54px;height:54px;right:105px;bottom:20px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="portrait"></div><div class="status"><div class="name">Lv.<span id="lvl">1</span> 荒境戰士　<span id="gold">0</span> 金</div><div class="bar"><i id="hpbar"></i></div><div class="bar mp"><i id="mpbar"></i></div></div></div>
<div id="topRight"><button class="topbtn" id="fsBtn">全螢幕</button><button class="topbtn" id="gmBtn">GM</button></div>
<div id="quest">荒境試煉<br><span id="questText">擊倒 0 / 15 隻怪物</span><br><small style="color:#a9956e">自動模式會尋找全圖目標。</small></div>
<div id="minimapWrap"><canvas id="mini"></canvas><div class="miniTitle">荒境外圍</div></div>
<div id="joystick"><div class="stick" id="stick"></div></div>
<div id="actions"><button class="skill" id="atk">攻擊</button><button class="skill" id="fire">烈火</button><button class="skill" id="bagBtn">背包</button><button class="skill" id="autoBtn">自動<br>OFF</button></div>
<div id="lootTip"></div><div id="fsHint">左下搖桿移動・右下自動掃圖・Safari 加入主畫面後可離線全螢幕</div><div id="debugTouch"></div>

<div class="panel" id="gmPanel"><div class="head"><h3>GM 控制台</h3><button class="close" data-close="gmPanel">✕</button></div><div class="panelBody">
<div class="gridBtns">
<button class="gmbtn" data-gm="god">無敵模式</button><button class="gmbtn" data-gm="kill">秒殺模式</button>
<button class="gmbtn" data-gm="gold">+100,000 金</button><button class="gmbtn" data-gm="level">+10 等級</button>
<button class="gmbtn" data-gm="spawn">刷新全圖怪物</button><button class="gmbtn" data-gm="boss">召喚赤月魔王</button>
<button class="gmbtn" data-gm="speed">2 倍移速</button><button class="gmbtn" data-gm="clear">清除全圖怪物</button>
</div>
<div class="gmrow"><select id="gmItem"><option>屠龍 +99</option><option>麻痺戒指</option><option>復活戒指</option><option>赤月戰甲</option><option>GM 神戒</option></select><button id="makeItem">生成裝備</button></div>
</div></div>

<div class="panel" id="bagPanel"><div class="head"><h3>角色 / 背包</h3><button class="close" data-close="bagPanel">✕</button></div><div class="panelBody">
<div class="equip"><div class="charCard">⚔️</div><div class="slots"><div class="slot"><b>武器</b><span id="weaponSlot">鐵劍</span></div><div class="slot"><b>衣服</b><span id="armorSlot">布甲</span></div><div class="slot"><b>戒指</b><span id="ringSlot">無</span></div><div class="slot"><b>戰力</b><span id="power">24</span></div></div></div>
<div class="items" id="items"></div>
</div></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const mini=document.getElementById('mini'),mctx=mini.getContext('2d');
const DPR=Math.min(2,window.devicePixelRatio||1);
let W=0,H=0;
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);mini.width=112*DPR;mini.height=112*DPR;mctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
const WORLD={w:2400,h:1600};
const player={x:WORLD.w/2,y:WORLD.h/2,hp:100,maxHp:100,mp:100,maxMp:100,lv:1,gold:0,atk:14,speed:155,r:18,dir:0,dead:false,god:false,oneHit:false,speed2:false,kills:0,inv:[],weapon:'鐵劍',armor:'布甲',ring:'無'};
let cam={x:player.x-W/2,y:player.y-H/2};
let move={x:0,y:0},tapTarget=null,auto=false,last=0,lastAttack=0,attackFlash=0,fireFlash=0,autoTarget=null,respawnTimer=0;
const obstacles=[
{x:490,y:350,w:250,h:140},{x:1630,y:330,w:330,h:150},{x:1010,y:1020,w:320,h:190},{x:170,y:960,w:260,h:180},
{x:780,y:200,w:170,h:110},{x:1820,y:980,w:280,h:210}
];
const props=[]; for(let i=0;i<52;i++){props.push({x:80+Math.random()*(WORLD.w-160),y:80+Math.random()*(WORLD.h-160),t:Math.random()<.75?'tree':'rock',s:.7+Math.random()*.7})}
let monsters=[],drops=[],floaters=[];
const monsterDefs=[
{name:'半獸勇士',hp:70,atk:6,speed:64,r:21,exp:10,c:'#7c6546',kind:'orc'},
{name:'骷髏戰士',hp:55,atk:5,speed:72,r:19,exp:8,c:'#d9d2b9',kind:'skel'},
{name:'荒原毒蛛',hp:45,atk:4,speed:85,r:18,exp:7,c:'#77553a',kind:'spider'},
{name:'赤月魔王',hp:450,atk:15,speed:52,r:33,exp:80,c:'#9b221f',kind:'boss',boss:true}
];
function spawnAll(){monsters=[];const pts=[[310,300],[450,620],[700,820],[930,480],[1160,300],[1320,720],[1510,560],[1820,690],[2110,420],[2070,1250],[1570,1270],[1100,1330],[560,1260],[330,1100],[1450,200]];pts.forEach((p,i)=>spawnMonster(i%3,p[0],p[1]));spawnMonster(3,2050,260)}
function spawnMonster(i,x,y){let d=monsterDefs[i],m={...d,x,y,maxHp:d.hp,hp:d.hp,id:Math.random(),vx:0,vy:0,hit:0,dead:false};monsters.push(m);return m}
spawnAll();
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function circleRect(x,y,r,o){let cx=clamp(x,o.x,o.x+o.w),cy=clamp(y,o.y,o.y+o.h);return (x-cx)**2+(y-cy)**2<r*r}
function canMove(x,y){if(x<30||y<30||x>WORLD.w-30||y>WORLD.h-30)return false;for(const o of obstacles)if(circleRect(x,y,player.r,o))return false;return true}
function movePlayer(dx,dy,dt){let len=Math.hypot(dx,dy);if(len<.001)return;dx/=len;dy/=len;player.dir=Math.atan2(dy,dx);let sp=player.speed*(player.speed2?2:1);let nx=player.x+dx*sp*dt,ny=player.y+dy*sp*dt;if(canMove(nx,player.y))player.x=nx;if(canMove(player.x,ny))player.y=ny}
function nearestMonster(){let best=null,bd=1e9;for(const m of monsters){if(m.dead)continue;let d=dist(player,m);if(d<bd){bd=d;best=m}}return best}
function attack(isFire=false){let now=performance.now();if(now-lastAttack<(isFire?900:420))return;lastAttack=now;if(isFire){if(player.mp<14)return;player.mp-=14;fireFlash=1}else attackFlash=1;let range=isFire?105:72;let hitAny=false;for(const m of monsters){if(m.dead)continue;let d=dist(player,m);if(d<=range){hitAny=true;let dmg=(isFire?player.atk*2.3:player.atk)*(player.oneHit?999:1)*(0.82+Math.random()*.35);dmg=Math.round(dmg);m.hp-=dmg;m.hit=1;floaters.push({x:m.x,y:m.y-30,text:'-'+dmg,t:1,c:isFire?'#ffd066':'#fff'});if(m.hp<=0)killMonster(m)}}if(!hitAny&&autoTarget&&dist(player,autoTarget)<120){} }
function killMonster(m){m.dead=true;player.kills++;player.gold+=m.boss?800:Math.floor(5+Math.random()*20);if(player.kills%5===0)player.lv++;drops.push({x:m.x+(Math.random()-.5)*30,y:m.y+(Math.random()-.5)*30,t:18,name:rollLoot(m.boss),rarity:m.boss?'legend':(Math.random()<.18?'epic':'normal')});floaters.push({x:m.x,y:m.y-45,text:m.boss?'BOSS 擊破！':'擊殺',t:1.3,c:'#ffd36b'});if(m.boss)setTimeout(()=>spawnMonster(3,2050,260),8000)}
function rollLoot(boss){const normal=['金創藥','強效太陽水','青銅盔','黑鐵戒指','斬馬刀'];const bossL=['裁決之杖','聖戰戒指','赤月戰甲','麻痺戒指'];return (boss?bossL:normal)[Math.floor(Math.random()*(boss?bossL.length:normal.length))]}
function pickup(){for(let i=drops.length-1;i>=0;i--){let d=drops[i];if(Math.hypot(player.x-d.x,player.y-d.y)<50){player.inv.push({name:d.name,rarity:d.rarity});showLoot('獲得 '+d.name);drops.splice(i,1);renderBag()}}}
function showLoot(s){let e=document.getElementById('lootTip');e.textContent=s;e.style.opacity=1;clearTimeout(showLoot.t);showLoot.t=setTimeout(()=>e.style.opacity=0,1300)}
function autoUpdate(dt){if(!auto)return;if(!autoTarget||autoTarget.dead)autoTarget=nearestMonster();if(!autoTarget){respawnTimer+=dt;if(respawnTimer>2){spawnAll();respawnTimer=0}return}let d=dist(player,autoTarget);if(d>62){movePlayer(autoTarget.x-player.x,autoTarget.y-player.y,dt)}else attack(false)}
function update(dt){if(player.dead)return;if(auto)autoUpdate(dt);else if(Math.hypot(move.x,move.y)>.05){tapTarget=null;movePlayer(move.x,move.y,dt)}else if(tapTarget){let dx=tapTarget.x-player.x,dy=tapTarget.y-player.y;if(Math.hypot(dx,dy)<12)tapTarget=null;else movePlayer(dx,dy,dt)}
for(const m of monsters){if(m.dead)continue;m.hit=Math.max(0,m.hit-dt*4);let d=dist(player,m);if(d<260){if(d>m.r+player.r+8){let dx=(player.x-m.x)/d,dy=(player.y-m.y)/d;m.x+=dx*m.speed*dt;m.y+=dy*m.speed*dt}else if(!player.god&&Math.random()<dt*.8){player.hp=Math.max(0,player.hp-m.atk);floaters.push({x:player.x,y:player.y-34,text:'-'+m.atk,t:.7,c:'#ff6b6b'});if(player.hp<=0){player.dead=true;setTimeout(()=>{player.hp=player.maxHp;player.x=WORLD.w/2;player.y=WORLD.h/2;player.dead=false},1200)}}}}
pickup();for(const f of floaters){f.y-=18*dt;f.t-=dt}floaters=floaters.filter(f=>f.t>0);attackFlash=Math.max(0,attackFlash-dt*6);fireFlash=Math.max(0,fireFlash-dt*5);player.mp=Math.min(player.maxMp,player.mp+dt*3);
cam.x+=(clamp(player.x-W/2,0,WORLD.w-W)-cam.x)*Math.min(1,dt*7);cam.y+=(clamp(player.y-H/2,0,WORLD.h-H)-cam.y)*Math.min(1,dt*7);
document.getElementById('hpbar').style.width=(player.hp/player.maxHp*100)+'%';document.getElementById('mpbar').style.width=(player.mp/player.maxMp*100)+'%';document.getElementById('lvl').textContent=player.lv;document.getElementById('gold').textContent=player.gold.toLocaleString();document.getElementById('questText').textContent='擊倒 '+player.kills+' / 15 隻怪物'}
function w2s(x,y){return{x:x-cam.x,y:y-cam.y}}
function drawGround(){ctx.fillStyle='#26361f';ctx.fillRect(0,0,W,H);let tile=96,startX=-((cam.x)%tile),startY=-((cam.y)%tile);for(let y=startY;y<H;y+=tile)for(let x=startX;x<W;x+=tile){let gx=Math.floor((x+cam.x)/tile),gy=Math.floor((y+cam.y)/tile);let v=((gx*31+gy*17)%7);ctx.fillStyle=v<2?'#2d3e24':'#2a3922';ctx.fillRect(x,y,tile,tile)}
// roads
ctx.save();ctx.translate(-cam.x,-cam.y);ctx.strokeStyle='#79603d';ctx.lineWidth=150;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(80,1260);ctx.bezierCurveTo(600,1150,760,760,1140,760);ctx.bezierCurveTo(1520,760,1730,450,2320,360);ctx.stroke();ctx.strokeStyle='#8a704a';ctx.lineWidth=95;ctx.stroke();ctx.restore()}
function drawObstacle(o,i){let s=w2s(o.x,o.y);if(s.x>W||s.y>H||s.x+o.w<0||s.y+o.h<0)return;ctx.save();ctx.translate(s.x,s.y);ctx.fillStyle='#5b4931';ctx.fillRect(0,0,o.w,o.h);ctx.fillStyle='#2c2318';for(let x=0;x<o.w;x+=32){ctx.fillRect(x,0,4,o.h)}ctx.fillStyle='#8b7147';ctx.fillRect(8,8,o.w-16,18);ctx.fillStyle='#1b1510';ctx.fillRect(o.w*.4,o.h*.55,o.w*.22,o.h*.45);ctx.fillStyle='#d1ad5a';ctx.font='bold 12px sans-serif';ctx.fillText(i%2?'廢棄寨屋':'荒原石屋',12,34);ctx.restore()}
function drawProp(p){let s=w2s(p.x,p.y);if(s.x<-60||s.y<-70||s.x>W+60||s.y>H+60)return;ctx.save();ctx.translate(s.x,s.y);ctx.scale(p.s,p.s);if(p.t==='tree'){ctx.fillStyle='#342718';ctx.fillRect(-6,8,12,30);ctx.fillStyle='#172815';ctx.beginPath();ctx.arc(0,0,24,0,Math.PI*2);ctx.fill();ctx.fillStyle='#294125';ctx.beginPath();ctx.arc(-9,-8,16,0,Math.PI*2);ctx.arc(12,-6,15,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle='#6d6e62';ctx.beginPath();ctx.moveTo(-17,12);ctx.lineTo(-8,-14);ctx.lineTo(15,-9);ctx.lineTo(22,10);ctx.closePath();ctx.fill()}ctx.restore()}
function drawPlayer(){let s=w2s(player.x,player.y);ctx.save();ctx.translate(s.x,s.y);ctx.rotate(player.dir);ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(0,18,18,7,0,0,Math.PI*2);ctx.fill();ctx.rotate(-player.dir);ctx.translate(0,-3); // body facing with legs animation
let walk=Math.sin(performance.now()/90)*3;ctx.strokeStyle='#322318';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-7,13);ctx.lineTo(-8+walk,28);ctx.moveTo(7,13);ctx.lineTo(8-walk,28);ctx.stroke();ctx.fillStyle='#6a1f19';ctx.fillRect(-13,-11,26,28);ctx.fillStyle='#b48a55';ctx.fillRect(-10,-5,20,5);ctx.fillStyle='#c89a68';ctx.beginPath();ctx.arc(0,-18,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2b1b15';ctx.beginPath();ctx.arc(0,-21,10,Math.PI,0);ctx.fill();ctx.strokeStyle=attackFlash?'#fff2a6':'#c8b077';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(13,-4);ctx.lineTo(attackFlash?36:25,attackFlash?-25:-10);ctx.stroke();if(fireFlash){ctx.strokeStyle='#ffb01b';ctx.lineWidth=9;ctx.beginPath();ctx.arc(8,-2,40,-.9,.55);ctx.stroke()}ctx.restore();ctx.fillStyle='#e9d9ad';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText('荒境戰士',s.x,s.y-38)}
function drawMonster(m){let s=w2s(m.x,m.y);if(s.x<-80||s.y<-80||s.x>W+80||s.y>H+80)return;ctx.save();ctx.translate(s.x,s.y);ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(0,m.r*.7,m.r*.9,m.r*.35,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=m.hit?.55:1;if(m.kind==='skel'){ctx.strokeStyle='#d7d1bb';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,-8,8,0,Math.PI*2);ctx.moveTo(0,0);ctx.lineTo(0,20);ctx.moveTo(-12,8);ctx.lineTo(12,8);ctx.moveTo(0,20);ctx.lineTo(-9,33);ctx.moveTo(0,20);ctx.lineTo(9,33);ctx.stroke()}else if(m.kind==='spider'){ctx.strokeStyle='#6c4b34';ctx.lineWidth=4;for(let i=-1;i<=1;i+=2){for(let y=-8;y<=10;y+=9){ctx.beginPath();ctx.moveTo(i*8,y);ctx.lineTo(i*24,y-8);ctx.stroke()}}ctx.fillStyle='#432a22';ctx.beginPath();ctx.ellipse(0,0,17,13,0,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle=m.boss?'#7f1517':'#6f5940';ctx.beginPath();ctx.arc(0,0,m.r,0,Math.PI*2);ctx.fill();ctx.fillStyle=m.boss?'#c44a2f':'#a98b5b';ctx.fillRect(-m.r*.7,-m.r*.9,m.r*1.4,m.r*1.1);ctx.fillStyle='#ddd';ctx.fillRect(-m.r*.55,-m.r*.25,5,5);ctx.fillRect(m.r*.25,-m.r*.25,5,5);if(m.boss){ctx.strokeStyle='#d4b04d';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-18,-28);ctx.lineTo(-8,-43);ctx.moveTo(18,-28);ctx.lineTo(8,-43);ctx.stroke()}}
ctx.globalAlpha=1;ctx.restore();ctx.textAlign='center';ctx.font='11px sans-serif';ctx.fillStyle=m.boss?'#ffbd6b':'#f0e4c3';ctx.fillText(m.name,s.x,s.y-m.r-22);let bw=m.boss?74:54;ctx.fillStyle='#190c0c';ctx.fillRect(s.x-bw/2,s.y-m.r-16,bw,5);ctx.fillStyle=m.boss?'#d5302c':'#a92823';ctx.fillRect(s.x-bw/2,s.y-m.r-16,bw*Math.max(0,m.hp/m.maxHp),5)}
function drawDrop(d){let s=w2s(d.x,d.y);if(s.x<-30||s.y<-30||s.x>W+30||s.y>H+30)return;let pulse=.8+Math.sin(performance.now()/150)*.15;ctx.save();ctx.translate(s.x,s.y);ctx.scale(pulse,pulse);ctx.fillStyle=d.rarity==='legend'?'#f0b43a':d.rarity==='epic'?'#9f62db':'#d4c69d';ctx.fillRect(-7,-7,14,14);ctx.strokeStyle='#fff8';ctx.strokeRect(-9,-9,18,18);ctx.restore();ctx.font='9px sans-serif';ctx.textAlign='center';ctx.fillStyle='#f6df9a';ctx.fillText(d.name,s.x,s.y-14)}
function drawFloat(f){let s=w2s(f.x,f.y);ctx.globalAlpha=Math.min(1,f.t*2);ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillStyle=f.c;ctx.fillText(f.text,s.x,s.y);ctx.globalAlpha=1}
function draw(){drawGround();for(const o of obstacles)drawObstacle(o,obstacles.indexOf(o));for(const p of props)drawProp(p);for(const d of drops)drawDrop(d);for(const m of monsters)if(!m.dead)drawMonster(m);drawPlayer();for(const f of floaters)drawFloat(f);drawMini()}
function drawMini(){let w=112,h=112;mctx.clearRect(0,0,w,h);mctx.fillStyle='#1d2a19';mctx.fillRect(0,0,w,h);for(const m of monsters){if(m.dead)continue;mctx.fillStyle=m.boss?'#ff4f42':'#c98b62';mctx.fillRect(m.x/WORLD.w*w-1,m.y/WORLD.h*h-1,m.boss?4:2,m.boss?4:2)}mctx.fillStyle='#62a8ff';mctx.beginPath();mctx.arc(player.x/WORLD.w*w,player.y/WORLD.h*h,3,0,Math.PI*2);mctx.fill()}
function loop(t){let dt=Math.min(.033,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
// robust joystick: Pointer Events + Touch fallback
const joy=document.getElementById('joystick'),stick=document.getElementById('stick');let activeId=null;
function joyPoint(clientX,clientY){let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=clientX-cx,dy=clientY-cy,max=r.width*.33,len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max;len=max}move.x=dx/max;move.y=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`}
function joyEnd(){activeId=null;move.x=move.y=0;stick.style.transform='translate(0,0)'}
joy.addEventListener('pointerdown',e=>{activeId=e.pointerId;try{joy.setPointerCapture(e.pointerId)}catch{} joyPoint(e.clientX,e.clientY);e.preventDefault()});joy.addEventListener('pointermove',e=>{if(activeId===e.pointerId){joyPoint(e.clientX,e.clientY);e.preventDefault()}});joy.addEventListener('pointerup',e=>{if(activeId===e.pointerId)joyEnd()});joy.addEventListener('pointercancel',joyEnd);
joy.addEventListener('touchstart',e=>{let t=e.changedTouches[0];joyPoint(t.clientX,t.clientY);e.preventDefault()},{passive:false});joy.addEventListener('touchmove',e=>{let t=e.changedTouches[0];joyPoint(t.clientX,t.clientY);e.preventDefault()},{passive:false});joy.addEventListener('touchend',e=>{joyEnd();e.preventDefault()},{passive:false});
// tap world to move
canvas.addEventListener('pointerdown',e=>{if(e.clientY>H-190||e.clientX>W-205&&e.clientY>H-200)return;tapTarget={x:e.clientX+cam.x,y:e.clientY+cam.y};auto=false;document.getElementById('autoBtn').innerHTML='自動<br>OFF'});
function bindPress(id,fn){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();fn()});el.addEventListener('touchstart',e=>{e.preventDefault();fn()},{passive:false})}
bindPress('atk',()=>attack(false));bindPress('fire',()=>attack(true));bindPress('autoBtn',()=>{auto=!auto;autoTarget=null;document.getElementById('autoBtn').innerHTML='自動<br>'+(auto?'ON':'OFF');showLoot(auto?'自動掃圖已開啟':'自動掃圖已關閉')});bindPress('bagBtn',()=>document.getElementById('bagPanel').classList.add('show'));bindPress('gmBtn',()=>document.getElementById('gmPanel').classList.add('show'));
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>document.getElementById(b.dataset.close).classList.remove('show')));
document.querySelectorAll('[data-gm]').forEach(b=>b.addEventListener('click',()=>{switch(b.dataset.gm){case'god':player.god=!player.god;showLoot('無敵 '+(player.god?'ON':'OFF'));break;case'kill':player.oneHit=!player.oneHit;showLoot('秒殺 '+(player.oneHit?'ON':'OFF'));break;case'gold':player.gold+=100000;showLoot('+100,000 金');break;case'level':player.lv+=10;player.atk+=50;showLoot('等級 +10');break;case'spawn':spawnAll();showLoot('全圖怪物已刷新');break;case'boss':spawnMonster(3,player.x+180,player.y);showLoot('赤月魔王已召喚');break;case'speed':player.speed2=!player.speed2;showLoot('2倍移速 '+(player.speed2?'ON':'OFF'));break;case'clear':monsters.forEach(m=>m.dead=true);showLoot('已清除全圖怪物');break;}}));
document.getElementById('makeItem').addEventListener('click',()=>{let n=document.getElementById('gmItem').value;let it={name:n,rarity:'legend'};player.inv.push(it);if(n.includes('屠龍')){player.weapon=n;player.atk=999}else if(n.includes('戰甲'))player.armor=n;else player.ring=n;renderBag();showLoot('GM 生成：'+n)});
function renderBag(){document.getElementById('weaponSlot').textContent=player.weapon;document.getElementById('armorSlot').textContent=player.armor;document.getElementById('ringSlot').textContent=player.ring;document.getElementById('power').textContent=Math.floor(player.atk*2+player.lv*7);let root=document.getElementById('items');root.innerHTML='';let base=[{name:'金創藥',rarity:'normal'},{name:'回城卷',rarity:'normal'},{name:'斬馬刀',rarity:'epic'}];[...base,...player.inv].slice(-20).forEach(it=>{let d=document.createElement('div');d.className='item '+it.rarity;d.textContent=it.name;root.appendChild(d)})}renderBag();
// fullscreen (works in browsers that allow it; Files preview may ignore it)
document.getElementById('fsBtn').addEventListener('click',async()=>{try{
  if(window.navigator.standalone){showLoot('目前已是主畫面全螢幕模式');return}
  if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();showLoot('已進入全螢幕');return}
  if(document.documentElement.webkitRequestFullscreen){document.documentElement.webkitRequestFullscreen();showLoot('已要求全螢幕');return}
  alert('iPhone：請用 Safari 的「分享」→「加入主畫面」。從桌面圖示啟動後就是獨立全螢幕，而且可離線玩。');
}catch{alert('iPhone：請用 Safari 的「分享」→「加入主畫面」。')}});
setTimeout(()=>document.getElementById('fsHint').style.display='none',4500);
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
window.addEventListener('load', () => {
  document.documentElement.dataset.runtime = 'ok';
});
</script>
